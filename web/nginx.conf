map $http_upgrade $liveboard_connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    server_tokens off;

    # Docker Compose DNS. Hostnames in proxy_pass variables are resolved per request.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Uploads are limited to 10 MB of image bytes. Leave room for the multipart envelope.
    client_max_body_size 12m;

    # The media directory also holds static Tech Summit files. These exact
    # routes belong to the React Media Library and must not trigger a directory redirect.
    location = /media {
        try_files /index.html =404;
    }

    location = /media/ {
        try_files /index.html =404;
    }

    location ^~ /media/tech-summit/ {
        try_files $uri =404;
    }

    location /api/ {
        # A variable keeps the original request path and resolves the API when the request arrives.
        set $liveboard_api api:4002;
        proxy_pass http://$liveboard_api$request_uri;
        proxy_http_version 1.1;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        set $liveboard_api api:4002;
        proxy_pass http://$liveboard_api$request_uri;
        proxy_http_version 1.1;
        proxy_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $liveboard_connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
