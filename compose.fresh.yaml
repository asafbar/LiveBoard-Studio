name: liveboard-studio-fresh

# First-time installation. This file creates empty database and media volumes.
# Do not mark those volumes external, and do not start this file with
# compose.prod.yaml or compose.yaml.
# Do not run docker compose down -v.
# Startup does not migrate, seed, or bootstrap an administrator.
# Image tags are :fresh so a build does not replace the :prod images.

services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    image: liveboard-studio-web:fresh
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:?WEB_PORT is required}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - liveboard

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: liveboard-studio-api:fresh
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4002"
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL is required}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      MEDIA_DIR: /app/storage/media
      COOKIE_SECURE: ${COOKIE_SECURE:?COOKIE_SECURE is required}
    volumes:
      - liveboard_studio_media:/app/storage/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:4002/api/health").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - liveboard

  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - liveboard_studio_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - liveboard

networks:
  liveboard:
    name: liveboard-studio-fresh

volumes:
  liveboard_studio_db:
    name: liveboard-studio-fresh_db
  liveboard_studio_media:
    name: liveboard-studio-fresh_media
